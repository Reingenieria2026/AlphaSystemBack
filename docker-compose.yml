version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-alpha
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: alpha_system
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - alpha_net

volumes:
  mysql_data:

networks:
  alpha_net:
